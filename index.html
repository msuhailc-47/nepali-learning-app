<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="description" content="Learn Nepali Language bit-by-bit with Trilingual Nepali-English-Malayalam bridge and audio." />
    <link rel="manifest" href="./manifest.json" />
    
    <!-- Google Fonts for Nepali Devanagari & Malayalam scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <title>MeroNepali - Trilingual Nepali Learning App</title>
  </head>
  <body class="bg-[#090d16] text-slate-100 font-sans selection:bg-crimson-500 selection:text-white antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg failed: ', err));
        });
      }
    </script>
  </body>
</html>
